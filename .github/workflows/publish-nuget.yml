name: Publish platform packages to NuGet

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Platform NuGet packages workflow run ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-nuget
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'cdd1037/Avalonia' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Verify source build and complete platform artifacts
        id: build
        uses: actions/github-script@v7
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        with:
          script: |
            if (!/^[0-9]+$/.test(process.env.BUILD_RUN_ID))
              throw new Error('build_run_id must be a numeric workflow run ID');
            const run_id = Number(process.env.BUILD_RUN_ID);
            const repo = context.repo;
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...repo, run_id });
            const { data: workflow } = await github.rest.actions.getWorkflow({ ...repo, workflow_id: run.workflow_id });
            if (run.status !== 'completed' || run.conclusion !== 'success' ||
                run.head_repository.full_name !== `${repo.owner}/${repo.repo}` ||
                !['push', 'workflow_dispatch'].includes(run.event) ||
                workflow.path !== '.github/workflows/platform-packages.yml')
              throw new Error('Only successful builds from this repository may be published');
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, { ...repo, run_id });
            for (const name of ['build (ubuntu-24.04, linux, linux-x64)',
                                'build (windows-latest, win, win-x64)',
                                'build (macos-15, osx, osx-arm64)',
                                'Restore and publish foreign operating systems']) {
              if (!jobs.some(j => j.name === name && j.conclusion === 'success'))
                throw new Error(`Required verification did not pass: ${name}`);
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, { ...repo, run_id });
            for (const platform of ['win', 'linux', 'osx']) {
              const matches = artifacts.filter(a => a.name === `platform-nuget-${platform}` && !a.expired);
              if (matches.length !== 1) throw new Error(`Missing or ambiguous ${platform} artifact`);
            }
            core.setOutput('sha', run.head_sha);
            core.setOutput('version', `12.2.999-platform.${run.run_number}`);
            await core.summary.addHeading('NuGet release')
              .addLink('Verified build', run.html_url)
              .addRaw(`\n\nSource: ${run.head_sha}\n\nVersion: 12.2.999-platform.${run.run_number}\n`)
              .write();
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require source build to be integrated into main
        env:
          BUILD_SHA: ${{ steps.build.outputs.sha }}
        run: git merge-base --is-ancestor "$BUILD_SHA" HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
          pattern: platform-nuget-*
          path: artifacts/release-input
      - name: Validate package identities, versions and dependency closure
        env:
          PACKAGE_VERSION: ${{ steps.build.outputs.version }}
        run: python scripts/nuget/prepare_release.py --source artifacts/release-input --output artifacts/release --version "$PACKAGE_VERSION"
      - name: Record exact package hashes
        uses: actions/upload-artifact@v4
        with:
          name: nuget-release-manifest
          path: artifacts/release/release-manifest.json
          overwrite: true
      - name: Obtain short-lived NuGet publishing credential
        id: login
        uses: NuGet/login@v1
        with:
          user: chengdd
      - name: Publish validated packages, SDK last
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        shell: pwsh
        run: |
          $packages = Get-Content artifacts/release/release-manifest.json -Raw | ConvertFrom-Json
          foreach ($package in $packages) {
            dotnet nuget push "artifacts/release/$($package.file)" --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "NuGet push failed: $($package.id)" }
          }
          "Published $($packages.Count) packages." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
